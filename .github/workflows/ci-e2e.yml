name: CI E2E (suzu)

# suzu/verify.sh は隔離 socket の tmux だけを使う E2E で数分で終わるため、PR ごとに回す。
# Linux runner で完結し macOS runner の課金を伴わない
on:
  pull_request:
    paths:
      - "suzu/**"
      - "Makefile"
      - ".github/workflows/ci-e2e.yml"
  push:
    branches: [main]
    paths:
      - "suzu/**"
      - "Makefile"
      - ".github/workflows/ci-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # runner の既定 locale は未設定で tmux が非 UTF-8 扱いになり、verify.sh が使う
  # 絵文字・日本語の window 名が _ にサニタイズされて照合が崩れる
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  e2e:
    name: e2e (tmux ${{ matrix.tmux.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 必須なのはユーザー環境と同じ 3.6a (Homebrew の bottle)。apt の 3.4 は旧版との互換を見る
    # 参考 job で、落ちても PR を止めない (tmux の公式配布はソース tarball のみで、
    # apt に入る版は runner の Ubuntu に固定される)
    continue-on-error: ${{ matrix.tmux.reference }}
    strategy:
      fail-fast: false
      matrix:
        tmux:
          - { label: "3.6a (brew)", install: brew, reference: false }
          - { label: "3.4 (apt)", install: apt, reference: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: suzu/go.mod
          cache-dependency-path: suzu/go.sum
      - name: tmux をインストールする (brew)
        if: matrix.tmux.install == 'brew'
        # runner の Homebrew は PATH に入っていないため shellenv で通す。
        # Homebrew が無い image では公式配布のソース tarball からビルドする
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            brew install tmux
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config libutf8proc-dev
            curl -sSL -o /tmp/tmux.tar.gz https://github.com/tmux/tmux/releases/download/3.6a/tmux-3.6a.tar.gz
            tar xzf /tmp/tmux.tar.gz -C /tmp
            cd /tmp/tmux-3.6a && ./configure --enable-utf8proc && make -j"$(nproc)" && sudo make install
          fi
      - name: tmux をインストールする (apt)
        if: matrix.tmux.install == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: tmux のバージョンを確認する
        run: |
          which tmux
          tmux -V
      - name: 隔離 socket の E2E (verify.sh) を実行する
        run: make verify-cli
